name: Publish HSE 01.00 notes (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hse-0100-notes.yml'

permissions:
  contents: write

jobs:
  update-release:
    if: github.repository == 'VegettoSan/Hungry-Shark-Evolution-Ps-Vita'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit '01.00' --repo "$GITHUB_REPOSITORY" --notes-file docs/RELEASE_01.00_BODY.md
